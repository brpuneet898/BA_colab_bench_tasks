version = "1.0"

[metadata]
task_type = "colab-bench"
category = "Customer Analytics"
tags = ["churn-analysis", "cohort-analysis", "time-series", "behavioral-analytics"]
task_name = "churn-cohort-analysis"
expert_time_estimate_min = 45

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 10800.0

[environment]
allow_internet = true
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240

[[environment.mcp_servers]]
name = "jupyter-mcp"
transport = "stdio"
command = "npx"
args = ["-y", "mcp-remote", "http://127.0.0.1:8888/mcp"]
